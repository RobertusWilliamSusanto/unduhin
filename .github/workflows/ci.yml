name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment and install extras
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev,ui]"

      - name: Run ruff lint check
        run: uv run --no-sync ruff check src tests

      - name: Run mypy strict type check
        run: uv run --no-sync mypy src/unduhin

      - name: Run pytest (offline unit & UI suite)
        run: uv run --no-sync pytest -v
